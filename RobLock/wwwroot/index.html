<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RobLock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/theme.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span>Rob<b>Lock</b></span>
  </a>
  <nav class="nav">
    <button type="button" class="navbtn" onclick="RobTheme.toggle()" aria-label="Switch between night and day theme">
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="lbl-night">NIGHT</span><span class="lbl-day">DAY</span>
    </button>
    <a class="navbtn" href="/admin.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      ADMIN
    </a>
  </nav>
</header>

<main class="hero">

  <div class="hero-text">
    <div class="pill"><i></i>System online</div>
    <h1 class="display">
      <span>Park it.</span>
      <span class="hl">Lock it.</span>
      <span>Walk away.</span>
    </h1>
    <p class="lead">RobLock is an automated bike lock. Scan your QR code to verify who you are, and the lock secures or releases your bike on its own. Any tampering is logged and sent to you and the guards.</p>
  </div>

  <section class="scanner" aria-label="QR scanner">
    <svg id="viewfinder" width="220" height="220" viewBox="0 0 220 220" fill="none" aria-hidden="true">
      <circle class="ring" cx="110" cy="110" r="40" stroke="#E8B060" stroke-width="1.5"/>
      <circle class="ring ring2" cx="110" cy="110" r="40" stroke="#E8B060" stroke-width="1.5"/>
      <g stroke="#E8B060" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
        <path d="M14 50V26Q14 14 26 14H50"/>
        <path d="M170 14H194Q206 14 206 26V50"/>
        <path d="M14 170V194Q14 206 26 206H50"/>
        <path d="M170 206H194Q206 206 206 194V170"/>
      </g>
      <g transform="translate(88 88)" stroke="#E8B060" stroke-width="3" opacity="0.9">
        <rect x="1.5" y="1.5" width="15" height="15" rx="3"/>
        <rect x="27.5" y="1.5" width="15" height="15" rx="3"/>
        <rect x="1.5" y="27.5" width="15" height="15" rx="3"/>
        <g fill="#E8B060" stroke="none">
          <rect x="6" y="6" width="6" height="6" rx="1"/>
          <rect x="32" y="6" width="6" height="6" rx="1"/>
          <rect x="6" y="32" width="6" height="6" rx="1"/>
          <rect x="28" y="28" width="6" height="6" rx="1"/>
          <rect x="38" y="38" width="6" height="6" rx="1"/>
        </g>
      </g>
    </svg>
    <video id="cam" playsinline muted hidden></video>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden aria-label="Take a photo of the QR code">
    <p id="caption" aria-live="polite">Hold your QR code up to the camera.</p>
    <button type="button" id="scan-btn" class="btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>
      <span id="scan-label">Scan QR</span>
    </button>
  </section>

</main>

<!-- QR reader (jsQR), served from this site so scanning never needs the internet -->
<script src="/js/jsQR.js"></script>
<script>
(function () {
  var btn = document.getElementById("scan-btn");
  var label = document.getElementById("scan-label");
  var cam = document.getElementById("cam");
  var view = document.getElementById("viewfinder");
  var photo = document.getElementById("photo");
  var caption = document.getElementById("caption");
  var IDLE = "Hold your QR code up to the camera.";

  var stream = null, timer = null;
  var scanning = false, starting = false, busy = false;
  var photoMode = false;               // true once the live camera has failed: Scan QR then opens the photo picker
  var detector = null;
  var lastBad = "", lastBadAt = 0;
  var canvas = document.createElement("canvas");
  var g2d = canvas.getContext("2d", { willReadFrequently: true });

  function say(text) { caption.textContent = text; }

  // The "hidden" property only exists on HTML elements, not on the SVG icon, so use the attribute.
  function setHidden(el, hide) {
    if (hide) el.setAttribute("hidden", "");
    else el.removeAttribute("hidden");
  }

  function makeDetector() {
    if ("BarcodeDetector" in window) {
      try { return new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { /* not supported for QR */ }
    }
    return null;
  }

  function stop() {
    scanning = false;
    clearTimeout(timer);
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    cam.srcObject = null;
    setHidden(cam, true);
    setHidden(view, false);
    label.textContent = "Scan QR";
  }

  // The QR holds either the full link (.../control.html?s=12345) or just the 5 digits.
  function extractId(text) {
    text = (text || "").trim();
    if (/^\d{5}$/.test(text)) return text;
    try {
      var s = new URL(text).searchParams.get("s");
      if (s && /^\d{5}$/.test(s)) return s;
    } catch (e) { /* not a link */ }
    return null;
  }

  // Check a scanned value with the server and open the controls if the session is active.
  async function handle(text) {
    var now = Date.now();
    if (text === lastBad && now - lastBadAt < 3000) return;   // same bad code, don't spam the server

    var id = extractId(text);
    if (!id) {
      lastBad = text; lastBadAt = now;
      say("That isn't a RobLock QR code.");
      return;
    }

    busy = true;
    try {
      var res = await fetch("/api/session/" + id);
      if (res.ok) {
        stop();
        say("Session found. Opening your controls...");
        window.location.href = "/control.html?s=" + id;
        return;
      }
      lastBad = text; lastBadAt = Date.now();
      say(res.status === 429
        ? "Too many tries. Wait a minute, then scan again."
        : "That session isn't active. Ask the admin for a new QR code.");
    } catch (e) {
      say("Could not reach the server. Check your connection.");
    } finally {
      busy = false;
    }
  }

  // ---- live camera ----

  function decodeVideoFrame() {
    if (!window.jsQR || !cam.videoWidth) return null;
    var scale = Math.min(1, 640 / cam.videoWidth);
    canvas.width = Math.round(cam.videoWidth * scale);
    canvas.height = Math.round(cam.videoHeight * scale);
    g2d.drawImage(cam, 0, 0, canvas.width, canvas.height);
    var img = g2d.getImageData(0, 0, canvas.width, canvas.height);
    var found = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
    return found ? found.data : null;
  }

  async function readFrame() {
    if (!cam.videoWidth) return null;
    if (detector) {
      try {
        var codes = await detector.detect(cam);
        return codes.length ? codes[0].rawValue : null;
      } catch (e) {
        detector = null;            // built-in reader failed: use jsQR from now on
      }
    }
    return decodeVideoFrame();
  }

  async function tick() {
    if (!scanning) return;
    if (!busy) {
      var text = await readFrame();
      if (text && scanning) await handle(text);
    }
    if (scanning) timer = setTimeout(tick, 150);
  }

  async function getStream() {
    try {
      return await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
    } catch (e) {
      if (e && (e.name === "OverconstrainedError" || e.name === "ConstraintNotSatisfiedError")) {
        return navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      }
      throw e;
    }
  }

  function failure(e) {
    var n = e && e.name;
    photoMode = true;               // next tap on Scan QR opens the photo picker instead
    if (n === "NotAllowedError" || n === "PermissionDeniedError") {
      say("Camera access is blocked. Allow it from the camera icon in the address bar, or tap Scan QR to use a photo instead.");
    } else if (n === "NotFoundError" || n === "DevicesNotFoundError") {
      say("No camera found. Tap Scan QR to choose a photo of the QR code instead.");
    } else if (n === "NotReadableError" || n === "TrackStartError") {
      photoMode = false;
      say("The camera is busy in another app or tab. Close it, then tap Scan QR again.");
    } else if (n === "SecurityError") {
      say("The camera needs a secure connection (https or localhost). Tap Scan QR to use a photo instead.");
    } else {
      say("The camera could not be started. Tap Scan QR to use a photo instead.");
    }
  }

  async function start() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      // No live camera on this page (usually plain http on a phone): use the phone's camera app for a photo.
      photoMode = true;
      say("Take a photo of the QR code, and RobLock will read it.");
      photo.click();
      return;
    }

    starting = true;
    say("Allow camera access when your browser asks.");
    try {
      stream = await getStream();
    } catch (e) {
      starting = false;
      failure(e);
      return;
    }

    // Show the camera straight away; reading the QR code happens afterwards and never turns it off.
    cam.srcObject = stream;
    setHidden(view, true);
    setHidden(cam, false);
    label.textContent = "Cancel";
    try { await cam.play(); } catch (e) { /* the stream is attached; playback starts when ready */ }

    detector = makeDetector();
    starting = false;
    say(window.jsQR || detector ? "Point the camera at the QR code." : "The QR reader file is missing from the site.");
    scanning = !!(window.jsQR || detector);
    if (scanning) tick();
  }

  // ---- photo fallback ----

  async function decodePhoto(file) {
    var bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { return null; }
    try {
      var d = makeDetector();
      if (d) {
        try {
          var codes = await d.detect(bmp);
          if (codes.length) return codes[0].rawValue;
        } catch (e) { /* fall through to jsQR */ }
      }
      if (!window.jsQR) return null;
      var sizes = [1280, 800, 500];     // phone photos are large; try a few scales
      for (var i = 0; i < sizes.length; i++) {
        var scale = Math.min(1, sizes[i] / Math.max(bmp.width, bmp.height));
        canvas.width = Math.max(1, Math.round(bmp.width * scale));
        canvas.height = Math.max(1, Math.round(bmp.height * scale));
        g2d.drawImage(bmp, 0, 0, canvas.width, canvas.height);
        var img = g2d.getImageData(0, 0, canvas.width, canvas.height);
        var found = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "attemptBoth" });
        if (found && found.data) return found.data;
      }
      return null;
    } finally {
      if (bmp.close) bmp.close();
    }
  }

  photo.addEventListener("change", async function () {
    var file = photo.files && photo.files[0];
    photo.value = "";                 // lets the same photo be chosen again
    if (!file) return;
    say("Reading the photo...");
    var text = await decodePhoto(file);
    if (!text) {
      say("Couldn't find a QR code in that photo. Move closer so it fills the frame, then tap Scan QR to try again.");
      return;
    }
    lastBad = "";
    await handle(text);
  });

  btn.addEventListener("click", function () {
    if (starting) return;
    if (stream) { stop(); say(IDLE); return; }
    if (photoMode) { photo.click(); return; }
    start();
  });

  window.addEventListener("pagehide", stop);
})();
</script>
</body>
</html>
