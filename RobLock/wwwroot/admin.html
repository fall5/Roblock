<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - RobLock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/theme.js"></script>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span>Rob<b>Lock</b></span>
  </a>
  <nav class="nav">
    <button type="button" class="navbtn" onclick="RobTheme.toggle()" aria-label="Switch between night and day theme">
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="lbl-night">NIGHT</span><span class="lbl-day">DAY</span>
    </button>
  </nav>
</header>

<main class="center">
  <section class="card" aria-labelledby="title">
    <h1 id="title">Admin login</h1>
    <p id="sub" class="muted">Checking the admin account...</p>

    <form id="form" hidden novalidate>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password">
      </div>
      <div class="field" id="confirm-wrap" hidden>
        <label for="pw2">Confirm password</label>
        <input id="pw2" type="password" autocomplete="new-password">
      </div>
      <p id="err" class="error" role="alert"></p>
      <button id="submit" class="btn" type="submit">Log in</button>
    </form>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), err = $("err"), configured = true;

  function json(r) { return r.json().catch(function () { return {}; }); }

  fetch("/api/admin/me").then(function (r) {
    if (r.ok) { location.replace("/dashboard"); return null; }
    return fetch("/api/admin/status").then(json);
  }).then(function (s) {
    if (!s) return;
    configured = !!s.configured;
    if (!configured) {
      $("title").textContent = "Set the admin password";
      $("sub").textContent = "First time here. Choose a password for the admin account. Use at least 8 characters.";
      $("confirm-wrap").hidden = false;
      $("pw").setAttribute("autocomplete", "new-password");
      $("submit").textContent = "Save password";
    } else {
      $("sub").textContent = "Enter the admin password to open the dashboard.";
    }
    form.hidden = false;
    $("pw").focus();
  }).catch(function () {
    $("sub").textContent = "Could not reach the server.";
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.textContent = "";
    var pw = $("pw").value;

    if (!pw) { err.textContent = "Enter the password."; return; }
    if (!configured) {
      if (pw.length < 8) { err.textContent = "Password needs to be at least 8 characters."; return; }
      if (pw !== $("pw2").value) { err.textContent = "The two passwords don't match."; return; }
    }

    $("submit").disabled = true;
    fetch(configured ? "/api/admin/login" : "/api/admin/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return json(r).then(function (d) { return { ok: r.ok, data: d }; });
    }).then(function (res) {
      if (res.ok) { location.href = "/dashboard"; return; }
      err.textContent = res.data.error || "Something went wrong. Try again.";
      $("submit").disabled = false;
    }).catch(function () {
      err.textContent = "Could not reach the server.";
      $("submit").disabled = false;
    });
  });
})();
</script>
</body>
</html>
