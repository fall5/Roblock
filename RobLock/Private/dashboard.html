<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - RobLock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Syne:wght@800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/theme.js"></script>
<style>
  .dash {
    padding: 28px 32px 48px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    align-items: start;
  }
  .panel {
    padding: 24px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--panel);
  }
  .panel h2 { margin: 0 0 18px; font-size: 22px; font-weight: 700; }
  .panel h3 { margin: 22px 0 8px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .panel h3:first-of-type { margin-top: 0; }

  .list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow: auto; }
  .list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .list li:first-child { border-top: none; }
  .list .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .list small { font-size: 12px; color: var(--muted); }
  .list .sid { font-size: 17px; font-weight: 700; }
  .list time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .empty { margin: 0; font-size: 14px; color: var(--muted); }

  .gen-row { display: flex; flex-direction: column; gap: 14px; }
  .gen-msg { min-height: 20px; margin: 10px 0 0; font-size: 14px; color: var(--warn); }
  #gen-result { margin-top: 12px; text-align: center; }
  .bigid { margin: 6px 0 12px; font-size: 44px; font-weight: 700; letter-spacing: 0.12em; }
  .qr { display: block; margin: 0 auto 12px; background: #fff; padding: 8px; border-radius: 12px; }
  .url { margin: 0 0 12px; font-size: 12px; color: var(--muted); word-break: break-all; }
  .hint { margin: 14px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted); text-align: left; }

  .dev { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--chip); margin-bottom: 14px; }
  .dev:last-child { margin-bottom: 0; }
  .dev-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dev-top h3 { margin: 0; font-size: 17px; color: var(--ink); }
  .dev-top .chips { display: flex; gap: 6px; }
  .dev .sess { margin: 8px 0 12px; font-size: 14px; color: var(--muted); }
  .dev .sess b { color: var(--ink); }
  .dev .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .dev .btn.small { height: 40px; padding: 0 14px; font-size: 14px; }
  .dev .qr { width: 140px; height: 140px; margin: 0 0 10px; }

  @media (max-width: 1100px) {
    .dash { grid-template-columns: 1fr; padding: 20px 16px 40px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span>Rob<b>Lock</b></span>
  </a>
  <nav class="nav">
    <button type="button" class="navbtn" onclick="RobTheme.toggle()" aria-label="Switch between night and day theme">
      <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <span class="lbl-night">NIGHT</span><span class="lbl-day">DAY</span>
    </button>
    <button type="button" class="navbtn" id="logout">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      LOG OUT
    </button>
  </nav>
</header>

<main class="dash">

  <section class="panel" aria-labelledby="h-history">
    <h2 id="h-history">History</h2>
    <h3>Sessions</h3>
    <ul class="list" id="sessions"></ul>
    <h3>Events</h3>
    <ul class="list" id="events"></ul>
  </section>

  <section class="panel" aria-labelledby="h-gen">
    <h2 id="h-gen">Generate new session</h2>
    <div class="gen-row">
      <div>
        <label for="device-select">Device</label>
        <select id="device-select"></select>
      </div>
      <button type="button" class="btn small" id="gen-btn">Generate session</button>
    </div>
    <p class="gen-msg" id="gen-msg" role="alert"></p>
    <div id="gen-result"></div>
  </section>

  <section class="panel" aria-labelledby="h-dev">
    <h2 id="h-dev">Devices</h2>
    <div id="devices"></div>
  </section>

</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var data = null, lastJson = "", shown = {}, created = null, selected = "";
  var onLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function when(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function clock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }

  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { location.href = "/admin.html"; throw new Error("not logged in"); }
      return r.json().catch(function () { return {}; }).then(function (d) {
        return { ok: r.ok, status: r.status, data: d };
      });
    });
  }

  function load() {
    return api("/api/admin/dashboard").then(function (r) {
      if (!r.ok) return;
      var json = JSON.stringify(r.data);
      if (json === lastJson) return;
      lastJson = json;
      data = r.data;
      render();
    }).catch(function () { /* offline or logged out: try again on the next tick */ });
  }

  function refresh() { lastJson = ""; return load(); }

  // ---- History: sessions (time in / time out) and events ----

  function statusChip(s) {
    if (s.status === "active") return '<span class="chip ok">Active</span>';
    if (s.status === "waiting") return '<span class="chip">Waiting</span>';
    return '<span class="chip warn">' + (s.endReason === "expired" ? "Expired" : "Ended") + "</span>";
  }

  function renderHistory() {
    $("sessions").innerHTML = data.sessions.length
      ? data.sessions.map(function (s) {
          return '<li><span class="mono sid">' + esc(s.id) + '</span>' +
            '<span class="grow"><b>' + esc(s.deviceName) + '</b>' +
            "<small>Time in: " + (s.timeIn ? esc(when(s.timeIn)) : "not yet") + "</small>" +
            "<small>Time out: " + (s.timeOut ? esc(when(s.timeOut)) : "still open") + "</small></span>" +
            statusChip(s) + "</li>";
        }).join("")
      : '<li><p class="empty">No sessions yet.</p></li>';

    $("events").innerHTML = data.events.length
      ? data.events.map(function (e) {
          var detail = [e.detail, e.deviceName, e.sessionId ? "Session " + e.sessionId : ""]
            .filter(Boolean).join(", ");
          var cls = e.kind === "ok" ? "ok" : e.kind === "warn" ? "warn" : "";
          return '<li><span class="grow"><b>' + esc(e.title) + "</b><small>" + esc(detail) + "</small></span>" +
            (cls ? '<span class="chip ' + cls + '">' + (cls === "ok" ? "OK" : "Alert") + "</span>" : "") +
            "<time>" + esc(clock(e.time)) + "</time></li>";
        }).join("")
      : '<li><p class="empty">No events yet.</p></li>';
  }

  // ---- Generate new session ----

  function renderSelect() {
    var sel = $("device-select");
    var keep = sel.value || selected;
    sel.innerHTML = '<option value="">Select a device</option>' + data.devices.map(function (d) {
      var inUse = !!d.activeSession;
      return '<option value="' + esc(d.id) + '"' + (inUse ? " disabled" : "") + ">" +
        esc(d.name) + (inUse ? " (in use)" : "") + "</option>";
    }).join("");
    var stillFree = data.devices.some(function (d) { return d.id === keep && !d.activeSession; });
    if (keep && stillFree) sel.value = keep;
    selected = sel.value;
  }

  function renderGenerated() {
    var box = $("gen-result");
    if (!created) {
      box.innerHTML = '<p class="empty">Pick a device and generate a session to get its QR code.</p>';
      return;
    }
    var live = data.sessions.filter(function (s) { return s.id === created.id && s.status !== "ended"; })[0];
    if (!live) {
      box.innerHTML = '<p class="empty">Session <b class="mono">' + esc(created.id) + "</b> has ended. Generate a new one.</p>";
      return;
    }
    var url = location.origin + "/control.html?s=" + live.id;
    box.innerHTML =
      '<p class="muted">' + esc(live.deviceName) + "</p>" +
      '<p class="bigid mono">' + esc(live.id) + "</p>" +
      '<img class="qr" width="200" height="200" src="/api/admin/sessions/' + esc(live.id) + '/qr.svg" alt="QR code for session ' + esc(live.id) + '">' +
      '<p class="url">' + esc(url) + "</p>" +
      '<button type="button" class="btn small ghost" id="copy-btn" data-url="' + esc(url) + '">Copy link</button>' +
      (onLocalhost
        ? '<p class="hint">This page is open on localhost, so phones can\'t open this QR code. Open the dashboard using this PC\'s network address instead (for example http://192.168.1.20:5000).</p>'
        : "");
  }

  $("device-select").addEventListener("change", function () { selected = this.value; });

  $("gen-btn").addEventListener("click", function () {
    var deviceId = $("device-select").value;
    var msg = $("gen-msg");
    msg.textContent = "";
    if (!deviceId) { msg.textContent = "Select a device first."; return; }
    api("/api/admin/sessions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ deviceId: deviceId })
    }).then(function (r) {
      if (!r.ok) { msg.textContent = r.data.error || "Could not create the session."; return; }
      created = r.data;
      refresh();
    }).catch(function () { /* handled by api() */ });
  });

  $("gen-result").addEventListener("click", function (e) {
    var b = e.target.closest("#copy-btn");
    if (!b) return;
    var url = b.getAttribute("data-url");
    var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy link"; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done, function () { b.textContent = "Copy failed"; });
    } else {
      var ta = document.createElement("textarea");
      ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (err) { b.textContent = "Copy failed"; }
      document.body.removeChild(ta);
    }
  });

  // ---- Devices: active QR, lock / unlock, buzzer ----

  function renderDevices() {
    $("devices").innerHTML = data.devices.map(function (d) {
      var s = d.activeSession;
      var open = s && shown[s.id];
      return '<article class="dev">' +
        '<div class="dev-top"><h3>' + esc(d.name) + "</h3>" +
        '<span class="chips"><span class="chip ' + (d.locked ? "ok" : "warn") + '">' + (d.locked ? "Locked" : "Unlocked") + "</span>" +
        (d.buzzer ? '<span class="chip warn">Buzzer on</span>' : "") + "</span></div>" +
        '<p class="sess">' + (s ? "Session <b class=\"mono\">" + esc(s.id) + "</b> (" + esc(s.status) + ")" : "No active session") + "</p>" +
        (open ? '<img class="qr" src="/api/admin/sessions/' + esc(s.id) + '/qr.svg" alt="QR code for session ' + esc(s.id) + '">' : "") +
        '<div class="btns">' +
          '<button type="button" class="btn small ghost" data-dev="' + esc(d.id) + '" data-act="lock">Lock</button>' +
          '<button type="button" class="btn small ghost" data-dev="' + esc(d.id) + '" data-act="unlock">Unlock</button>' +
          '<button type="button" class="btn small ghost" data-dev="' + esc(d.id) + '" data-act="' + (d.buzzer ? "buzzer-off" : "buzzer-on") + '">' + (d.buzzer ? "Stop buzzer" : "Buzzer") + "</button>" +
        "</div>" +
        (s
          ? '<div class="btns">' +
              '<button type="button" class="btn small" data-qr="' + esc(s.id) + '">' + (open ? "Hide QR" : "Show QR") + "</button>" +
              '<button type="button" class="btn small ghost" data-end="' + esc(s.id) + '">End session</button>' +
            "</div>"
          : "") +
        "</article>";
    }).join("");
  }

  $("devices").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-act")) {
      api("/api/admin/devices/" + encodeURIComponent(b.getAttribute("data-dev")) + "/" + b.getAttribute("data-act"), { method: "POST" })
        .then(refresh).catch(function () {});
    } else if (b.hasAttribute("data-qr")) {
      var sid = b.getAttribute("data-qr");
      shown[sid] = !shown[sid];
      renderDevices();
    } else if (b.hasAttribute("data-end")) {
      api("/api/admin/sessions/" + encodeURIComponent(b.getAttribute("data-end")) + "/end", { method: "POST" })
        .then(refresh).catch(function () {});
    }
  });

  function render() {
    renderHistory();
    renderSelect();
    renderGenerated();
    renderDevices();
  }

  $("logout").addEventListener("click", function () {
    api("/api/admin/logout", { method: "POST" }).then(function () { location.href = "/admin.html"; }).catch(function () {});
  });

  load();
  setInterval(function () { if (!document.hidden) load(); }, 3000);
})();
</script>
</body>
</html>
